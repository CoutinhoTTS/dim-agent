[package]
name = "dim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dimcode"
path = "src/main.rs"

[dependencies]
dim-agent-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
uuid.workspace = true
sha2 = "0.10.9"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["tiff"] }
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSEnumerator"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Memory", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
