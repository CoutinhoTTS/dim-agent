[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
# See docs/release/README.md for the maintenance and unreachable-API decisions.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Syntect 5.3's syntax-set format uses bincode 1; no maintained compatible release exists." },
    { id = "RUSTSEC-2024-0320", reason = "Syntect 5.3's syntax definition loader uses yaml-rust; replacement belongs with the vendored highlighter update." },
    { id = "RUSTSEC-2024-0436", reason = "The vendored terminal stack uses ratatui 0.29 and its paste macro dependency; no compatible maintained paste release exists." },
    { id = "RUSTSEC-2026-0002", reason = "Only ratatui 0.29 uses lru 0.12.5: its private layout cache calls new, resize and get_or_insert, never IterMut. Recheck on terminal dependency upgrades." },
    { id = "RUSTSEC-2026-0253", reason = "Ratatui 0.29's private lru 0.12.5 cache never calls pop; its (Rect, Layout) keys also have no panicking Drop. Recheck on terminal dependency upgrades." },
]

[licenses]
include-dev = true
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "MIT-0", "Unicode-3.0", "Zlib"]
# The certificate datasets have a data license, scoped to their owning crates.
exceptions = [
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]
