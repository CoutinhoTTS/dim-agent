name: Native code layout

on:
  pull_request:
    paths:
      - scripts/code-layout/**
      - scripts/code-layout*.test.mjs
      - .github/workflows/code-layout.yml
      - rust-toolchain.toml
      - .node-version
  workflow_dispatch:
    inputs:
      measure:
        description: Compare validated baseline and ordered binaries
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux-artifact:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: rustup show
      - run: node --test scripts/code-layout.test.mjs scripts/code-layout-darwin.test.mjs scripts/code-layout-replay.test.mjs

  platform-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            test: scripts/code-layout-darwin.test.mjs
          - platform: darwin-x64
            runner: macos-15-intel
            test: scripts/code-layout-darwin.test.mjs
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            test: scripts/code-layout-windows.test.mjs
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            test: scripts/code-layout-windows.test.mjs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Select native MSVC Rust toolchain
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $channel = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolchain = "$channel-${{ matrix.target }}"
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
      - name: Configure Windows C/C++ toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      - name: Locate lld-link
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $linker = Get-Command lld-link -ErrorAction SilentlyContinue
          if (!$linker) {
            $linker = Get-ChildItem -Recurse -Filter lld-link.exe -ErrorAction SilentlyContinue `
              -Path "$env:ProgramFiles\LLVM\bin", "$env:ProgramFiles\Microsoft Visual Studio\2022\*\VC\Tools\Llvm\*\bin" |
              Select-Object -First 1
          }
          if ($linker) {
            $path = if ($linker -is [System.Management.Automation.ApplicationInfo]) { $linker.Source } else { $linker.FullName }
            Split-Path $path >> $env:GITHUB_PATH
            Write-Output "Using $path"
          } else {
            Write-Output 'lld-link is not on PATH; the build will use the Rust toolchain rust-lld'
          }
      - run: rustup show
      - run: node --test ${{ matrix.test }} scripts/code-layout-replay.test.mjs
        env:
          DIM_LAYOUT_ARTIFACTS: ${{ runner.temp }}/layout-fixture-${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: layout-fixture-${{ matrix.platform }}
          path: ${{ runner.temp }}/layout-fixture-${{ matrix.platform }}/*
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  native-layout:
    if: github.event_name == 'workflow_dispatch'
    needs: [linux-artifact, platform-artifact]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      DIM_LAYOUT_PLATFORM: ${{ matrix.platform }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.platform == 'darwin-arm64' && 'thin' || 'fat' }}
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Select native MSVC Rust toolchain
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $channel = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolchain = "$channel-${{ matrix.target }}"
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
      - name: Configure Windows C/C++ toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      - name: Locate lld-link
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $linker = Get-Command lld-link -ErrorAction SilentlyContinue
          if (!$linker) {
            $linker = Get-ChildItem -Recurse -Filter lld-link.exe -ErrorAction SilentlyContinue `
              -Path "$env:ProgramFiles\LLVM\bin", "$env:ProgramFiles\Microsoft Visual Studio\2022\*\VC\Tools\Llvm\*\bin" |
              Select-Object -First 1
          }
          if ($linker) {
            $path = if ($linker -is [System.Management.Automation.ApplicationInfo]) { $linker.Source } else { $linker.FullName }
            Split-Path $path >> $env:GITHUB_PATH
            Write-Output "Using $path"
          } else {
            Write-Output 'lld-link is not on PATH; the build will use the Rust toolchain rust-lld'
          }
      - run: rustup show
      - name: Provision Windows native build dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            Get-Command clang-cl -ErrorAction Stop
          } elseif (!(Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --version=2.16.03 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ProgramFiles/NASM" >> $env:GITHUB_PATH
          }
      - name: Build, train and validate the native executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP "dim-layout-$env:DIM_LAYOUT_PLATFORM"
          python scripts/code-layout/build.py --output $output --jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content (Join-Path $output "manifest.json")
      - name: Build, train and validate the native executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dim-layout-$DIM_LAYOUT_PLATFORM"
          python3 scripts/code-layout/build.py --output "$output" --jobs 2
          cat "$output/manifest.json"
      - name: Measure the validated executables
        if: inputs.measure
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / ("dim-layout-" + os.environ["DIM_LAYOUT_PLATFORM"])
          subprocess.run([sys.executable, "scripts/code-layout/build.py", "--output", output, "--measure-only"], check=True)
      - name: Preserve reusable baseline after a layout failure
        if: failure()
        shell: python
        run: |
          import os, tarfile
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / ("dim-layout-" + os.environ["DIM_LAYOUT_PLATFORM"])
          if (output / "capture.json").is_file() and not (output / "manifest.json").exists():
              with tarfile.open(output / "capture.tar", "w") as archive:
                  for name in ("capture", "capture.json"):
                      archive.add(output / name, arcname=name)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: layout-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/capture.tar
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/dimcode*
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/baseline
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/baseline.exe
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/manifest.json
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/symbols.order
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/*.pages
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/*.map
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/cargo-original*
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/baseline-replay*
            ${{ runner.temp }}/dim-layout-${{ matrix.platform }}/replay.json
          if-no-files-found: warn
          retention-days: 1
          overwrite: true
