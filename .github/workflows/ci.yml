name: PR check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-cli:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify native Windows CLI boundaries
        run: cargo test --locked -p dim-cli --lib
  verify:
    # PR runners must be isolated from release credentials and private networks.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify public source
        shell: bash
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER
          export CARGO_INCREMENTAL=0
          cargo build --workspace --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo run --locked -p xtask -- check
          node --test scripts/*.test.mjs
      - name: Build the Web workspace
        shell: bash
        run: |
          set -euo pipefail
          # The frontend is a separate artifact; building it here type-checks web/.
          node scripts/stage-web.mjs staging/release-web "$(node -p "require('./npm/package.json').version")" "$GITHUB_SHA"
      - name: Verify actual CLI profiles and terminal launcher
        shell: bash
        run: |
          set -euo pipefail
          export DIM_TEST_APP_SERVER="$PWD/target/debug/dim-app-server"
          export DIM_TEST_NPM_WRAPPER="$PWD/npm/bin/dimcode.mjs"
          cargo test --locked -p dimcode --test cli_flow -- --ignored
      - name: Verify public Node bindings
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- npm/branch-services.d.ts
          npm ci --prefix runtime --ignore-scripts --registry=https://registry.npmjs.org
          npm ci --prefix runtime/plugins/web --ignore-scripts --registry=https://registry.npmjs.org
          npm ci --prefix runtime/plugins/session-title --ignore-scripts --registry=https://registry.npmjs.org
          npm ci --prefix runtime/plugins/workflow --ignore-scripts --registry=https://registry.npmjs.org
          (cd runtime && npm install --no-save --ignore-scripts --install-links ./plugins/web ./plugins/session-title ./plugins/workflow)
          node --test runtime/plugin-sdk.test.mjs
          node --test runtime/plugins/goal/goal.test.mjs
          node runtime/node_modules/typescript/bin/tsc -p runtime/plugins/web/tsconfig.json
          node --test runtime/plugins/web/web.test.mjs
          node runtime/node_modules/typescript/bin/tsc -p runtime/plugins/session-title/tsconfig.json
          node --test runtime/plugins/session-title/session-title.test.mjs
          node runtime/node_modules/typescript/bin/tsc -p runtime/plugins/workflow/tsconfig.json
          node --test runtime/plugins/workflow/workflow.test.mjs
          python -m venv runtime/.venv
          runtime/.venv/bin/python -m pip install --require-hashes --no-deps -r runtime/python-requirements.txt
          export DIM_TEST_NODE="$(command -v node)"
          export DIM_TEST_JS_RUNTIME="$PWD/runtime/node_modules/@arcships/rutis-runtime"
          export DIM_TEST_RUTIS_SDK="$PWD/runtime/node_modules/@arcships/rutis/src/index.mjs"
          export DIM_TEST_PYTHON="$PWD/runtime/.venv/bin/python"
          cargo test --locked -p dim-app-server --test transport_flow --test mcp_http_flow node_ -- --ignored
